name: apk-arch-probe（设备能不能吃 aarch64_generic 索引）

# 单独一条快工作流：不编固件，只回答一个决定源策略的问题。
# 数据取自真实产物：Release 资产 rootfs.squashfs —— 里面有设备真正用的
# /etc/apk/arch、/etc/apk/keys 与合法的 /lib/apk/db/installed，
# 不用手搓空文件糊弄 apk（上一轮就是这么造出假结论的）。

on:
  workflow_dispatch:
    inputs:
      index_url:
        description: 要试的第三方索引地址
        required: false
        default: https://openwrt.daeuniverse.org/25.12/packages/aarch64_generic/packages.adb
      rootfs_url:
        description: 取真实 apk 库用的 rootfs.squashfs（默认先用老仓库那一版，本仓库首次构建成功后可换成自己的）
        required: false
        default: https://github.com/likz0421/ponwrt-xg040gmd/releases/download/tyfza1-plus/rootfs.squashfs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get -qq update -o Acquire::Retries=3
          sudo apt-get install -y squashfs-tools curl
          if command -v apk >/dev/null 2>&1; then
            echo "APK=$(command -v apk)" >> "$GITHUB_ENV"
          elif sudo apt-get install -y apk-tools >/dev/null 2>&1 && command -v apk >/dev/null 2>&1; then
            echo "APK=$(command -v apk)" >> "$GITHUB_ENV"
          else
            echo "::error::装不到 apk 可执行文件（Ubuntu 源里没有 apk-tools）—— 这条快探针做不了，改用构建内探针"
            exit 1
          fi
          "$APK" --version

      - name: Take the real rootfs from the Release
        env:
          ROOTFS_URL: ${{ inputs.rootfs_url }}
        run: |
          set -euo pipefail
          echo "rootfs 来源：$ROOTFS_URL"
          curl -sL -o "$RUNNER_TEMP/rootfs.squashfs" "$ROOTFS_URL"
          test -s "$RUNNER_TEMP/rootfs.squashfs" || { echo "::error::下载失败"; exit 1; }
          echo "rootfs.squashfs $(wc -c < "$RUNNER_TEMP/rootfs.squashfs") 字节"
          unsquashfs -d "$RUNNER_TEMP/root" -q "$RUNNER_TEMP/rootfs.squashfs"
          for f in etc/apk/arch lib/apk/db/installed; do
            [ -s "$RUNNER_TEMP/root/$f" ] || { echo "::error::rootfs 里没有 $f"; find "$RUNNER_TEMP/root/etc/apk" "$RUNNER_TEMP/root/lib/apk" | head -10; exit 1; }
          done
          echo "设备声明的架构：$(tr '\n' ' ' < "$RUNNER_TEMP/root/etc/apk/arch")"
          echo "真实 apk 库：$(wc -c < "$RUNNER_TEMP/root/lib/apk/db/installed") 字节，装了多少包：$(grep -c '^P:' "$RUNNER_TEMP/root/lib/apk/db/installed" || true)"
          echo "镜像里 honk 的版本：$(awk '/^P:honk$/{f=1;next} f&&/^V:/{print substr($0,3); exit} f&&/^P:/{exit}' "$RUNNER_TEMP/root/lib/apk/db/installed")"

      - name: Try the third-party index with the device's real arch list
        env:
          INDEX: ${{ inputs.index_url }}
        run: |
          set -euo pipefail
          SB="$RUNNER_TEMP/sb"
          mk_sandbox() {
            local alias="$1"
            rm -rf "$SB"
            mkdir -p "$SB/etc/apk/keys" "$SB/lib/apk/db"
            cp "$RUNNER_TEMP/root/lib/apk/db/installed" "$SB/lib/apk/db/installed"
            [ -s "$RUNNER_TEMP/root/lib/apk/db/world" ] && cp "$RUNNER_TEMP/root/lib/apk/db/world" "$SB/lib/apk/db/world" || true
            cp "$RUNNER_TEMP/root/etc/apk/arch" "$SB/etc/apk/arch"
            cp "$RUNNER_TEMP/root"/etc/apk/keys/* "$SB/etc/apk/keys/" 2>/dev/null || true
            curl -sL -o "$SB/etc/apk/keys/daeuniverse.pem" \
              "https://raw.githubusercontent.com/daeuniverse/openwrt-packages/main/keys/public-key.pem"
            [ -s "$SB/etc/apk/keys/daeuniverse.pem" ] || echo "::warning::公钥没取到，验签会失败"
            [ -n "$alias" ] && printf '%s\n' "$alias" >> "$SB/etc/apk/arch"
            printf '%s\n' "@daeuniverse $INDEX" > "$SB/etc/apk/repositories"
            echo "-- /etc/apk/arch = $(tr '\n' ' ' < "$SB/etc/apk/arch")"
          }
          run_case() {
            local tag="$1" q n
            mk_sandbox "$2"
            if ! "$APK" --root "$SB" update > "$RUNNER_TEMP/update-$tag.log" 2>&1; then
              echo "   [$tag] apk update 失败："; tail -6 "$RUNNER_TEMP/update-$tag.log" || true
              return 0
            fi
            q="$({ "$APK" --root "$SB" search -a honk 2>&1 || true; }; { "$APK" --root "$SB" info -a honk 2>&1 || true; })"
            printf '%s\n' "$q" | grep -i honk | head -4
            n="$(printf '%s' "$q" | grep -ci 'honk-' || true)"
            echo "   [$tag] 候选数=$n"
            eval "${tag}_HITS=$n"
            return 0
          }
          A_HITS=0; B_HITS=0
          run_case A ""
          run_case B "aarch64_generic"
          echo "VERDICT：设备原样命中 $A_HITS；加 aarch64_generic 别名后命中 $B_HITS"
          if [ "${A_HITS:-0}" -gt 0 ]; then
            echo "VERDICT: 官方/daeuniverse 的 generic 索引设备原样就能用 —— 设备源可以直接换成它，不需要自建仓库"
          elif [ "${B_HITS:-0}" -gt 0 ]; then
            echo "VERDICT: 需要把 aarch64_generic 追加进 /etc/apk/arch 才能用 —— 混装稳定版 userspace 的风险要先评估"
          else
            echo "VERDICT: 两条路都拿不到候选 —— 「用大家都能用的源」在 a55 上做不到，只能自产"
          fi
