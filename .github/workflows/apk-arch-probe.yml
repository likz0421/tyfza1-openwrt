name: apk-arch-probe（设备能不能吃 aarch64_generic 索引）

# 单独一条快工作流：不编固件，只回答一个决定源策略的问题。
# 数据取自真实产物：Release 资产 rootfs.squashfs —— 里面有设备真正用的
# /etc/apk/arch、/etc/apk/keys 与合法的 /lib/apk/db/installed，
# 不用手搓空文件糊弄 apk（上一轮就是这么造出假结论的）。

on:
  workflow_dispatch:
    inputs:
      index_url:
        description: 要试的第三方索引地址
        required: false
        default: https://openwrt.daeuniverse.org/25.12/packages/aarch64_generic/packages.adb
      rootfs_url:
        description: 取真实 apk 库用的 rootfs.squashfs（默认本仓库自己 Release 里那份）
        required: false
        default: https://github.com/likz0421/tyfza1-openwrt/releases/download/tyfza1/rootfs.squashfs

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get -qq update -o Acquire::Retries=3
          sudo apt-get install -y squashfs-tools curl qemu-user-static
          # 不再用宿主的 apk：ubuntu-24.04 的 apk-tools 与固件里那份（apk-tools 3.0.5）
          # 不是同一代，前两次探针 "Unable to read database" 就是这么来的 ——
          # 那是探针环境的问题，不是索引的结论。现在直接在解出来的真实 rootfs 里
          # chroot 跑设备自己那份 apk，用 qemu-user 执行 aarch64 二进制。
          ls -l /usr/bin/qemu-aarch64-static
          echo "qemu 就绪，下一步在 chroot 里调用设备自己的 apk"

      - name: Take the real rootfs from the Release
        env:
          ROOTFS_URL: ${{ inputs.rootfs_url }}
        run: |
          set -euo pipefail
          echo "rootfs 来源：$ROOTFS_URL"
          curl -sL -o "$RUNNER_TEMP/rootfs.squashfs" "$ROOTFS_URL"
          test -s "$RUNNER_TEMP/rootfs.squashfs" || { echo "::error::下载失败"; exit 1; }
          echo "rootfs.squashfs $(wc -c < "$RUNNER_TEMP/rootfs.squashfs") 字节"
          # 非 root 解包时 unsquashfs 建不了 dev/console 这个字符设备，会**以 exit 2 结束**
          # —— 上一次这条就是这么挂的，而它其实已经解出 3526/3527 个文件。
          # 用 sudo 解（能建节点），再把所有权还给 runner，下一步才复制得动。
          sudo unsquashfs -d "$RUNNER_TEMP/root" -q "$RUNNER_TEMP/rootfs.squashfs"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/root"
          for f in etc/apk/arch lib/apk/db/installed; do
            [ -s "$RUNNER_TEMP/root/$f" ] || { echo "::error::rootfs 里没有 $f"; find "$RUNNER_TEMP/root/etc/apk" "$RUNNER_TEMP/root/lib/apk" | head -10; exit 1; }
          done
          echo "设备声明的架构：$(tr '\n' ' ' < "$RUNNER_TEMP/root/etc/apk/arch")"
          echo "真实 apk 库：$(wc -c < "$RUNNER_TEMP/root/lib/apk/db/installed") 字节，装了多少包：$(grep -c '^P:' "$RUNNER_TEMP/root/lib/apk/db/installed" || true)"
          echo "镜像里 honk 的版本：$(awk '/^P:honk$/{f=1;next} f&&/^V:/{print substr($0,3); exit} f&&/^P:/{exit}' "$RUNNER_TEMP/root/lib/apk/db/installed")"

      - name: Try the candidate indexes with the device's own apk
        env:
          DAE_INDEX: ${{ inputs.index_url }}
          OFF_PKGS: https://downloads.openwrt.org/releases/25.12.6/packages/aarch64_generic/packages/packages.adb
          OFF_LUCI: https://downloads.openwrt.org/releases/25.12.6/packages/aarch64_generic/luci/packages.adb
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/root"
          # 设备自己那份 apk（apk-tools 3.0.5，aarch64）+ qemu-user，语义和真机一致。
          sudo cp /usr/bin/qemu-aarch64-static "$ROOT/usr/bin/"
          # chroot 里解析不了 127.0.0.53（宿主是 systemd-resolved 的话），直接写云上那两台。
          if grep -q '127.0.0.53' /etc/resolv.conf 2>/dev/null; then
            printf 'nameserver 168.63.129.16\nnameserver 8.8.8.8\n' | sudo tee "$ROOT/etc/resolv.conf" >/dev/null
          else
            sudo cp -f /etc/resolv.conf "$ROOT/etc/resolv.conf"
          fi
          if [ ! -s "$ROOT/etc/ssl/certs/ca-certificates.crt" ]; then
            sudo mkdir -p "$ROOT/etc/ssl/certs"
            sudo cp -f /etc/ssl/certs/ca-certificates.crt "$ROOT/etc/ssl/certs/"
            echo "镜像里没有 CA bundle，临时借宿主的（只为让 TLS 走通，不影响架构判定）"
          fi
          sudo mkdir -p "$ROOT/tmp"
          # squashfs 里通常没有 /dev/null（init 时由内核建的），chroot 里的 apk 要写它就报错。
          sudo mkdir -p "$ROOT/dev"
          if [ ! -e "$ROOT/dev/null" ]; then sudo mknod "$ROOT/dev/null" c 1 3; sudo chmod 666 "$ROOT/dev/null"; fi
          # 别用 `ls a b`：其中一个不存在时 ls 退出码是 2，配上 pipefail + 2>/dev/null
          # 就是"整步 30ms 内无声死掉"（上一轮就是这么挂的，日志里一个字都没有）。
          APKBIN=""
          for c in sbin/apk usr/bin/apk bin/apk; do
            if [ -f "$ROOT/$c" ]; then APKBIN="$c"; break; fi
          done
          [ -n "$APKBIN" ] || { echo "::error::rootfs 里没有 apk 二进制，探针做不了"; find "$ROOT" -maxdepth 3 -name 'apk*' 2>/dev/null | head -10 || true; exit 1; }
          echo "设备 apk：/$APKBIN"
          devapk() { sudo chroot "$ROOT" /usr/bin/qemu-aarch64-static "/$APKBIN" "$@"; }

          # 验签要的钥匙：daeuniverse 的 + OpenWrt 25.12 官方发布钥。
          # 官方钥从官方 25.12.6 的 rootfs 打包里取（GitHub 上的 keyring 镜像停在 2025-08，
          # 那份里没有 openwrt-25.12.pem，别拿它当真相）。
          curl -sL -o "$ROOT/etc/apk/keys/daeuniverse.pem" \
            "https://raw.githubusercontent.com/daeuniverse/openwrt-packages/main/keys/public-key.pem"
          [ -s "$ROOT/etc/apk/keys/daeuniverse.pem" ] || echo "::warning::daeuniverse 公钥没取到"
          curl -sL -o "$RUNNER_TEMP/official-rootfs.tar.gz" \
            "https://downloads.openwrt.org/releases/25.12.6/targets/armsr/armv8/openwrt-25.12.6-armsr-armv8-rootfs.tar.gz"
          if tar -tzf "$RUNNER_TEMP/official-rootfs.tar.gz" >/dev/null 2>&1; then
            sudo tar -xzf "$RUNNER_TEMP/official-rootfs.tar.gz" -C "$ROOT" --no-same-owner \
              --wildcards 'etc/apk/keys/*.pem' --keep-newer-files 2>/dev/null || true
            echo "官方 rootfs 里的 apk 钥匙：$(ls "$ROOT"/etc/apk/keys/ | tr '\n' ' ')"
            echo "官方 armv8 设备声明的架构：$(tar -xzO -f "$RUNNER_TEMP/official-rootfs.tar.gz" etc/apk/arch 2>/dev/null | tr '\n' ' ')"
          else
            echo "::warning::官方 rootfs 打包没拿到，官方索引那一路会因缺钥匙而验签失败 —— 那是钥匙问题，不是架构问题"
          fi
          sudo chmod -R u+rw "$ROOT/etc/apk"

          ORIG_ARCH="$RUNNER_TEMP/arch.orig"
          sudo cp "$ROOT/etc/apk/arch" "$ORIG_ARCH"
          DEV_ARCH=$(tr '\n' ',' < "$ORIG_ARCH" | sed 's/,$//')
          echo "设备原样声明的架构：$DEV_ARCH"

          setup_case() {
            local tag="$1" alias="$2"
            sudo cp "$ORIG_ARCH" "$ROOT/etc/apk/arch"
            if [ -n "$alias" ]; then printf '%s\n' "$alias" | sudo tee -a "$ROOT/etc/apk/arch" >/dev/null; fi
            printf '%s\n' \
              "@daeuniverse $DAE_INDEX" \
              "@openwrt-pkgs $OFF_PKGS" \
              "@openwrt-luci $OFF_LUCI" > "$RUNNER_TEMP/repositories.list"
            sudo cp "$RUNNER_TEMP/repositories.list" "$ROOT/etc/apk/repositories"
            echo "-- 用例 $tag：/etc/apk/arch = $(sudo tr '\n' ' ' < "$ROOT/etc/apk/arch")"
          }

          # 三个探针包：honk 只在 daeuniverse 有；curl 在官方 packages；luci-app-ddns 在官方 luci。
          # 三种问法都试（search / policy / add --simulate），任一给出带版本号的候选就算吃得到。
          probe_pkg() {
            local p="$1" out n
            out="$( { devapk search -a -- "$p" 2>&1 || true; }; { devapk policy -- "$p" 2>&1 || true; }; { devapk add --simulate -- "$p" 2>&1 || true; } )"
            n="$(printf '%s\n' "$out" | grep -c -- "${p}-[0-9]" || true)"
            echo "     $(printf '%-14s' "$p") 候选=$n  $( { printf '%s\n' "$out" | grep -m1 -- "${p}-[0-9]"; } || { printf '%s\n' "$out" | grep -m1 -iE 'no such package|ERROR'; } || echo '(无输出)')"
            HIT="$n"
          }

          A_TOT=0; B_TOT=0; A_OK=0; B_OK=0
          for tag in A B; do
            if [ "$tag" = A ]; then setup_case A ""; else setup_case B "aarch64_generic"; fi
            log="$RUNNER_TEMP/update-$tag.log"
            if devapk update > "$log" 2>&1; then
              echo "   [$tag] apk update 跑通（$(wc -l < "$log") 行输出）"
              if [ "$tag" = A ]; then A_OK=1; else B_OK=1; fi
            else
              echo "   [$tag] apk update 没跑通 —— 这是探针环境/钥匙的问题，不能当成索引或架构的结论："
              tail -6 "$log" || true
            fi
            for p in honk curl luci-app-ddns; do
              probe_pkg "$p"
              if [ "$tag" = A ]; then A_TOT=$((A_TOT + HIT)); else B_TOT=$((B_TOT + HIT)); fi
            done
          done

          echo "VERDICT：设备原样（$DEV_ARCH）命中 $A_TOT（update_ok=$A_OK）；追加 aarch64_generic 后命中 $B_TOT（update_ok=$B_OK）"
          echo "（Honk 走 daeuniverse；官方 25.12.6 那两路是 packages=$OFF_PKGS 与 luci=$OFF_LUCI）"
          if [ "${A_TOT:-0}" -gt 0 ] && [ "$A_OK" = 1 ]; then
            echo "VERDICT: generic 索引设备原样就能吃 —— 设备源可以直接换成官方 + daeuniverse，不需要自建仓库"
          elif [ "${B_TOT:-0}" -gt 0 ] && [ "$B_OK" = 1 ]; then
            echo "VERDICT: 必须把 aarch64_generic 追加进 /etc/apk/arch 才吃得到 —— 源可以换成官方的，但固件要写那一行"
          elif [ "$A_OK" != 1 ] && [ "$B_OK" != 1 ]; then
            echo "VERDICT: 两组都没跑通 apk update —— 探针无法下结论，先修探针，别把它当成『a55 只能用自建源』"
          else
            echo "VERDICT: update 跑通但候选为 0 —— generic 索引对 a55 确实不可用"
          fi
