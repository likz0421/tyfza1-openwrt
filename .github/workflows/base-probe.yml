name: base-probe（25.12.6 能不能承载 TYFZA1 端口）

# 目的单一：把"官方稳定版 v25.12.6 + LeoooChen 的 rtl9617c 端口"到底卡在哪一步
# 跑成日志，不猜。三道门槛依次是：
#   1) 端口自带的 openwrt 补丁在 25.12.6 上打不打得上（port-overlay.sh 逐条报）
#   2) target/linux/rtl9617c 声明的 KERNEL_PATCHVER（端口是 6.18）在这棵树里
#      有没有对应的内核版本文件（25.12 系只有 target/linux/generic/kernel-6.12）
#   3) 过得了前两道，才谈得上 defconfig / 内核与驱动编译
#
# 探针的「绿」= 拿到明确结论，不等于「编过了」。6.18 端口内核补丁套 6.12
# 打不上是有效的迁移结论：step11 只认日志里的补丁失败证据与全量预检清单，
# 输出 INCOMPATIBLE；真实编译错误、或端口原生内核系列下的失败一律 exit 1。
# 出固件的 build.yml 及其 eBPF/BTF、honk LuCI 面板硬断言不在这里，本文件不碰。
on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 基座标签或分支（如 v25.12.6 / openwrt-25.12 / master）
        required: false
        default: v25.12.6
      kernel_patchver:
        description: 强制把端口的 KERNEL_PATCHVER 改成这个值（留空=用端口声明的 6.18）
        required: false
        default: ''
      do_defconfig:
        description: 跑 make defconfig 并验 WiFi 驱动能否被选中
        type: boolean
        default: true
      do_kernel_build:
        description: 继续编内核与驱动（耗时长，只有前两道过了才建议开）
        type: boolean
        default: false
      skip_unapplicable_patches:
        description: 打不上的 openwrt 补丁记为跳过并继续（只为问"驱动/内核能不能过"，产出的 config 不可刷）
        type: boolean
        default: false

permissions:
  contents: read

env:
  WORK: ${{ github.workspace }}/work

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ctrl

      - name: Load pins
        env:
          IN_REF: ${{ inputs.openwrt_ref }}
          IN_KV: ${{ inputs.kernel_patchver }}
        run: |
          set -euo pipefail
          # 输入只在这里进 shell（经 env 映射，不往脚本文本里插值），并当场校验
          case "$IN_REF" in
            ''|*[!A-Za-z0-9._-]*) echo "::error::openwrt_ref 不合法：[$IN_REF]"; exit 1;;
          esac
          case "$IN_KV" in
            *[!0-9.]*|*[!A-Za-z0-9.]*) echo "::error::kernel_patchver 只允许数字和点：[$IN_KV]"; exit 1;;
          esac
          set -a; . "$GITHUB_WORKSPACE/ctrl/pins.env"; set +a
          for v in OPENWRT_URL PORT_URL PORT_SHA THEME_SHA HONK_SHA256 DAEUNIV_SHA; do
            [ -n "${!v:-}" ] || { echo "::error::pins.env 缺 $v"; exit 1; }
          done
          {
            echo "OPENWRT_URL=$OPENWRT_URL"
            echo "PORT_URL=$PORT_URL"
            echo "PORT_SHA=$PORT_SHA"
            echo "PORT_KERNEL_PATCHVER=$PORT_KERNEL_PATCHVER"
            echo "PROBE_REF=$IN_REF"
            echo "PROBE_KV=$IN_KV"
          } >> "$GITHUB_ENV"
          echo "基座=$IN_REF 端口=$PORT_SHA 端口声明内核=$PORT_KERNEL_PATCHVER 内核覆盖=${IN_KV:-（不覆盖）}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -hT /

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update -o Acquire::Retries=3
          sudo apt-get install -y build-essential busybox clang-18 llvm-18 lld-18 flex bison gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget curl device-tree-compiler u-boot-tools swig \
            libelf-dev python3-pyelftools python3-dev libfuse-dev pkgconf cmake ninja-build ccache

      - name: Fetch base OpenWrt at the requested ref
        env:
          IN_REF: ${{ inputs.openwrt_ref }}
        run: |
          set -euo pipefail
          REF="$IN_REF"
          case "$REF" in
            *[!A-Za-z0-9._-]*|'') echo "::error::openwrt_ref 不合法：[$REF]（只允许字母数字 . _ -）"; exit 1;;
          esac
          mkdir -p "$WORK"
          git init -q "$WORK/sources/openwrt"
          git -C "$WORK/sources/openwrt" remote add origin "$OPENWRT_URL"
          case "$REF" in
            v*) git -C "$WORK/sources/openwrt" fetch -q --depth 1 origin "refs/tags/$REF" ;;
            *)  git -C "$WORK/sources/openwrt" fetch -q --depth 1 origin "$REF" ;;
          esac
          git -C "$WORK/sources/openwrt" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "基座 HEAD $(git -C "$WORK/sources/openwrt" rev-parse --short HEAD) $(git -C "$WORK/sources/openwrt" show -s --format=%cI HEAD)"
          echo "通用内核细节文件：$(ls "$WORK/sources/openwrt/target/linux/generic" | grep '^kernel-' | tr '\n' ' ')"
          echo "airoha 在不在（XG 那条线关心）：$(ls "$WORK/sources/openwrt/target/linux" | grep -c '^airoha$') 个目录匹配"

      - name: Clone port repo at pinned SHA
        run: |
          set -euo pipefail
          git clone -q "$PORT_URL" "$WORK/port"
          git -C "$WORK/port" fetch -q --depth 1 origin "$PORT_SHA"
          git -C "$WORK/port" checkout -q FETCH_HEAD
          test -f "$WORK/port/port/scripts/sync-overlay.sh"
          echo "端口 $(git -C "$WORK/port" rev-parse --short HEAD) 版本 $(cat "$WORK/port/VERSION")"

      - name: Apply port overlay onto this base
        # port-overlay.sh 用 exit 2 表达"补丁打不上"，这是结论不是崩溃：
        # 捕获它、继续把后面的门槛跑完，最后一并给 VERDICT。
        env:
          TYFZA1_VERSION_REPO: https://downloads.openwrt.org/releases/25.12.6
          SKIP_UNAPPLICABLE: ${{ inputs.skip_unapplicable_patches && '1' || '0' }}
        run: |
          set -uo pipefail
          chmod +x "$GITHUB_WORKSPACE/ctrl/scripts/port-overlay.sh"
          # 上游 openwrt-patches 是按 master 写的，在 v25.12.6 上上下文对不上。
          # 按该 tag 的真实文件重做过两份补丁，这里交给 port-overlay.sh 逐条真 apply。
          if [ "${PROBE_REF:-}" = v25.12.6 ]; then
            export PORT_PATCH_DIR="$GITHUB_WORKSPACE/ctrl/patches/v25.12.6"
            for p in 100-wifi-ucode-txpower.patch 160-mtd-utils-host-zstd.patch; do
              [ -s "$PORT_PATCH_DIR/$p" ] || { echo "::error::缺 25.12.6 重基线补丁 $p"; exit 1; }
            done
            echo "使用 25.12.6 重基线补丁：$PORT_PATCH_DIR"
          fi
          # runner 用 `bash -e {0}` 执行 run 块：任何非 0 都会当场中止，`rc=$?` 那行
          # 根本活不到（上一轮三个探针就是这么把日志吞掉的）。必须用 && / || 形态取状态码。
          bash "$GITHUB_WORKSPACE/ctrl/scripts/port-overlay.sh" \
            "$WORK/sources/openwrt" "$WORK/port" > "$WORK/overlay.log" 2>&1 && rc=0 || rc=$?
          cat "$WORK/overlay.log" || true
          if [ "$rc" = 2 ]; then
            echo "OVERLAY_VERDICT=补丁打不上（详见上面逐条）"
            echo "::error::端口在 $PROBE_REF 上有补丁打不上"
            exit 2
          elif [ "$rc" != 0 ]; then
            echo "::error::port-overlay.sh 异常退出 $rc"; exit "$rc"
          fi
          echo "OVERLAY_VERDICT=全部落位"

      - name: Point the target at the requested kernel series
        run: |
          set -euo pipefail
          KV="$PROBE_KV"
          MK="$WORK/sources/openwrt/target/linux/rtl9617c/Makefile"
          [ -s "$MK" ] || { echo "::error::没有 $MK（overlay 没铺成？）"; exit 1; }
          echo "改前：$(grep -E '^KERNEL_PATCHVER' "$MK" || true)"
          if [ -n "$KV" ]; then
            sed -i "s/^KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:=$KV/" "$MK"
            echo "已强制为 $KV（只动工作树，不改上游仓库）"
            # 端口只带 config/files/patches-6.18。强行改用 6.12 后构建系统会去找
            # *-6.12，三者全缺 ⇒ 内核 .config 只剩 generic 种子，syncconfig 停在
            # 交互式提问 "Page size choice[1-3?]: ARM64_4K_PAGES (NEW)" 直接 Error 1。
            # 这是探针环境不完整，不是"内核编不过"的结论，先把种子补齐再谈编译。
            TDIR="$WORK/sources/openwrt/target/linux/rtl9617c"
            SRC_KV="${PORT_KERNEL_PATCHVER:-6.18}"
            if [ "$KV" != "$SRC_KV" ]; then
              echo "== 内核系列 $SRC_KV → $KV：按新系列复刻端口的 target 内核文件（试验性回移）=="
              # config / files 先朴素复刻作为兜底（保证即便本仓库没有对应产物也能跑），
              # 随后由下面三段用本仓库的重基线产物覆盖：patches（已验证 0 失败）、
              # files（驱动适配工作区）、config（重排后的内核配置种子）。
              for kind in config files; do
                src="$TDIR/$kind-$SRC_KV"; dst="$TDIR/$kind-$KV"
                if [ -e "$dst" ]; then
                  echo "  $kind-$KV 已存在，沿用"
                elif [ -e "$src" ]; then
                  cp -a "$src" "$dst"
                  echo "  $kind-$SRC_KV → $kind-$KV（驱动 API 未必兼容 6.12，后续真错误照实报）"
                else
                  echo "  ::warning::端口没有 $kind-$SRC_KV，$kind-$KV 缺失"
                fi
              done
              # patches：优先用本仓库已按 6.12 内核源码重基线、并在干净 post-generic 6.12.112
              # 树上 0 失败全量验证过的版本（patches/rtl9617c-6.12/patches-6.12），而不是把
              # 6.18 补丁直接改名成 6.12（那会在 CI 上报 10+ 个 INCOMPAT，是之前探针假红的根因）。
              CTRL_P12="$GITHUB_WORKSPACE/ctrl/patches/rtl9617c-6.12/patches-6.12"
              if [ -d "$CTRL_P12" ]; then
                rm -rf "$TDIR/patches-$KV"
                cp -a "$CTRL_P12" "$TDIR/patches-$KV"
                echo "  用本仓库重基线的 patches-$KV 覆盖（共 $(ls "$TDIR/patches-$KV"/*.patch 2>/dev/null | wc -l) 个，已验证 0 失败）"
              else
                echo "  ::warning::ctrl 里没有重基线的 patches-$KV，退回朴素改名（可能 INCOMPAT）"
                if [ ! -e "$TDIR/patches-$KV" ] && [ -e "$TDIR/patches-$SRC_KV" ]; then
                  cp -a "$TDIR/patches-$SRC_KV" "$TDIR/patches-$KV"
                fi
              fi
              # files：优先用本仓库的 files-6.12（6.18 新驱动的 6.12 适配工作区）。
              # 目前内容与端口 files-6.18 相同——驱动 API 不兼容 6.12 这件事留给内核
              # 编译期如实暴露，不在这里做「假装编得过」的裁剪。
              CTRL_F12="$GITHUB_WORKSPACE/ctrl/patches/rtl9617c-6.12/files-$KV"
              if [ -d "$CTRL_F12" ]; then
                rm -rf "$TDIR/files-$KV"
                cp -a "$CTRL_F12" "$TDIR/files-$KV"
                echo "  用本仓库的 files-$KV 覆盖（共 $(find "$TDIR/files-$KV" -type f | wc -l) 个文件）"
              fi
              # config：优先用本仓库重排好的 config-6.12（剔掉 6.18 独有的自动符号、
              # 补齐 ARM64_4K_PAGES），而不是直接沿用 6.18 那份 dump。
              CTRL_C12="$GITHUB_WORKSPACE/ctrl/patches/rtl9617c-6.12/config-$KV"
              if [ -f "$CTRL_C12" ]; then
                cp -f "$CTRL_C12" "$TDIR/config-$KV"
                echo "  用本仓库重排的 config-$KV 覆盖（$(grep -cE '^CONFIG_' "$TDIR/config-$KV") 条）"
              fi
              CFG="$TDIR/config-$KV"
              if [ -f "$CFG" ] && ! grep -qE '^CONFIG_ARM64_(4K|16K|64K)_PAGES=y' "$CFG"; then
                printf '\n# kernel %s：页大小 choice 不给答案会让 syncconfig 在非交互 CI 挂掉\nCONFIG_ARM64_4K_PAGES=y\n' "$KV" >> "$CFG"
                echo "  已补 CONFIG_ARM64_4K_PAGES=y 到 config-$KV（4KB 是 arm64 默认）"
              fi
              # 补丁层已按 6.12 全量重基线（0 失败），整份保持原样交给内核编译期。
              # 真正的迁移门槛在 files 层：files-6.12 是朴素复刻的 6.18 新驱动源码
              # （约 120 个文件，含 rtl_ax_ap/pci.c 等），API 面向 6.18 内核，落到 6.12
              # 上会编不过——这正是要拿到的真证据。不为「编过」而删驱动，那样只会把
              # 「编过了」变成假答案。编译失败的真错误照实报给 step11 收尾。
            fi
          fi
          echo "改后：$(grep -E '^KERNEL_PATCHVER' "$MK")"
          WANT=$(sed -n 's/^KERNEL_PATCHVER:=\(.*\)$/\1/p' "$MK" | head -1)
          if [ -f "$WORK/sources/openwrt/target/linux/generic/kernel-$WANT" ]; then
            echo "内核系列 $WANT 在这棵树里有版本文件 ✔"
            grep -E 'LINUX_VERSION-|SOURCE' "$WORK/sources/openwrt/target/linux/generic/kernel-$WANT" \
              | sed 's/^/    /' | head -4 || true
          else
            echo "::error::基座没有 target/linux/generic/kernel-$WANT —— 这棵树不支持内核 $WANT（端口需要 $PORT_KERNEL_PATCHVER）"
            exit 3
          fi

      - name: defconfig and check the Wi-Fi driver becomes selectable
        if: inputs.do_defconfig == true
        run: |
          set -euo pipefail
          cd "$WORK/sources/openwrt"
          # 扫描缓存整份作废：KernelPackage 在 target/linux/*/modules.mk，由
          # package/kernel/linux/Makefile 扫进 .packageinfo；每目录各自的 dump
          # 缓存 tmp/info/.packageinfo-* 不删就等于没作废（上一轮就是这么丢 WiFi 的）。
          rm -rf tmp/info tmp/.packageinfo tmp/.targetinfo \
                 tmp/.config-package.in tmp/.config-target.in
          make -s prepare-tmpinfo V=s > "$WORK/tmpinfo.log" 2>&1 || \
            { echo "::error::prepare-tmpinfo 失败"; tail -30 "$WORK/tmpinfo.log"; exit 1; }
          echo "kmod-rtl-ax-ap：.packageinfo=$( { grep -c '^Package: kmod-rtl-ax-ap$' tmp/.packageinfo || true; } ) 处  kconfig=$( { grep -c 'config PACKAGE_kmod-rtl-ax-ap' tmp/.config-package.in || true; } ) 处"
          make defconfig </dev/null > "$WORK/defconfig.log" 2>&1 || {
            echo "::error::make defconfig 失败"; tail -40 "$WORK/defconfig.log"; exit 1; }
          grep -iE 'warn|unmet|depend|error' "$WORK/defconfig.log" | head -15 || true
          MISS=""
          for p in kmod-rtl-ax-ap wpad-mbedtls wifi-scripts iw wireless-regdb; do
            grep -qx "CONFIG_PACKAGE_$p=y" .config || MISS="$MISS $p"
          done
          [ -z "$MISS" ] || { echo "::error::defconfig 后仍没选中 WiFi 组件:$MISS"; exit 1; }
          echo "✅ WiFi 五项在 $PROBE_REF 上都能选中"

      - name: Build kernel and the rtl_ax_ap driver
        if: inputs.do_kernel_build == true
        run: |
          set -euo pipefail
          cd "$WORK/sources/openwrt"
          make tools/install -j"$(nproc)" > "$WORK/tools.log" 2>&1 || {
            echo "::error::tools/install 失败"; tail -30 "$WORK/tools.log"; exit 1; }
          make toolchain/install -j"$(nproc)" > "$WORK/tc.log" 2>&1 || {
            echo "::error::toolchain/install 失败"; tail -30 "$WORK/tc.log"; exit 1; }
          # 端口给的 config-6.12 是片段，arm64 架构级符号不全（上一轮缺
          # RODATA_FULL_DEFAULT_ENABLED）。内核 syncconfig 碰到 (NEW) 符号会去读 stdin，
          # 非交互 CI 里这一步直接判失败，于是永远看不到驱动的真错误。这里用 OpenWrt
          # 自带的 target/linux/oldconfig：让 kconfig 按默认值补全，并把差额回写进
          # target/linux/rtl9617c/config-6.12（老规则会过滤掉自动推导符号）。
          # 另外 oldconfig 模式不静音依赖告警，能顺便看到 unmet direct dependencies
          # ——syncconfig 模式把它们藏掉了。
          # yes 被 SIGPIPE 打死是 141，pipefail 会把 make 的成功盖成失败，这里只对它关掉。
          set +o pipefail
          yes "" | make target/linux/oldconfig > "$WORK/oldconfig.log" 2>&1 || {
            echo "::error::target/linux/oldconfig 失败"; tail -40 "$WORK/oldconfig.log"; exit 1; }
          set -o pipefail
          echo "=== oldconfig 判定为 NEW 的符号 ==="
          grep -oE '\(([A-Z][A-Z0-9_]*)\) \[[^]]*\] \(NEW\)' "$WORK/oldconfig.log" \
            | sed -E 's/\) \[.*//; s/^\(//' | sort -u | head -40 || true
          echo "=== 依赖不满足（syncconfig 模式看不到，这里补上）==="
          grep -A6 -iE "unmet (direct )?dependencies|WARNING: unmet" "$WORK/oldconfig.log" \
            | head -60 || true
          CFG12="target/linux/rtl9617c/config-${PROBE_KV:-$(sed -n 's/^KERNEL_PATCHVER:=\(.*\)$/\1/p' target/linux/rtl9617c/Makefile | head -1)}"
          echo "=== 回写后的 $CFG12：$(grep -cE '^CONFIG_' "$CFG12" || true) 条 ==="
          grep -E '^CONFIG_(RODATA_FULL_DEFAULT_ENABLED|ARM64_4K_PAGES)=' "$CFG12" || true
          cp "$CFG12" "$WORK/config-completed.log"
          # -k 让内核构建在第一个失败后继续跑，一次把所有出错目录都摊出来——
          # 不带 -k 时 make 停在第一个失败处，每 40 分钟只能暴露一处驱动错误。
          # 有了 -k，重试三次不会有任何新信息，所以只跑一轮。
          ATTEMPT_LOG="$WORK/kernel-1.log"
          if make -k target/compile -j"$(nproc)" </dev/null > "$ATTEMPT_LOG" 2>&1; then
            echo "✅ 内核与驱动在 $PROBE_REF 上编过了"
          else
            # 并行不带 V=s 时真正的编译错误被收进 logs/，stdout 只剩
            # "ERROR: target/linux failed to build" 这一行 —— 上一轮就是这样
            # 拿不到原因的。把 logs/ 并进来才拿得全（8MB 上限防炸）。
            ALLLOG="$ATTEMPT_LOG"
            if [ -n "$(find logs -type f -print -quit 2>/dev/null || true)" ]; then
              find logs -type f -exec cat {} + 2>/dev/null \
                | tail -c 8000000 > "$WORK/kernel-1.logs.log" || true
              cat "$ATTEMPT_LOG" "$WORK/kernel-1.logs.log" > "$WORK/kernel-combined.log" 2>/dev/null || true
              ALLLOG="$WORK/kernel-combined.log"
            fi
            echo "=== oldconfig 补完之后还剩哪些 (NEW) 提问 ==="
            grep -oE '\(([A-Z][A-Z0-9_]*)\) \[[^]]*\] \(NEW\)' "$ALLLOG" \
              | sed -E 's/\) \[.*//; s/^\(//' | sort -u | head -40 || true
            echo "=== 出错文件排名（6.18 驱动面向 6.12 的断点就在这些文件里）==="
            grep -oE '[A-Za-z0-9_./-]+\.(c|h):[0-9]+:[0-9]+: (error|warning):' "$ALLLOG" \
              | sed -E 's/:[0-9]+:[0-9]+: (error|warning):$//' | sed 's|.*/||' \
              | sort | uniq -c | sort -rn | head -30 || true
            echo "=== 全部真实错误（去重，最多 120 条）==="
            sed -E 's|/home/runner/work/tyfza1-openwrt/tyfza1-openwrt/work/sources/openwrt/||g' \
              "$ALLLOG" | grep -E 'error:|Error [0-9]+$|undefined reference|No rule to make target' \
              | sort -u | head -120 || true
            if ! grep -qE 'error:' "$ALLLOG"; then
              # 一条编译错误都没有＝根本没走到编译（例如又卡在 kconfig），
              # 单跑一次 -j1 V=s 把原因逼到 stdout。
              echo "=== 没见到编译错误，就地 -j1 V=s 重跑拿原因 ==="
              make target/compile -j1 V=s </dev/null > "$WORK/kernel-verbose.log" 2>&1 || true
              grep -nE 'error:|Error [0-9]|\*\*\*|No rule to make target|No such file' \
                "$WORK/kernel-verbose.log" | tail -25 || true
              tail -40 "$WORK/kernel-verbose.log" || true
            fi
            # 一轮拿全不兼容补丁清单：make 遇到第一个打不上的补丁就停，
            # 逐个 dry-run 才能避免每 40 分钟只暴露一个。
            TREE="$PWD"
            : > "$WORK/dryrun.log"
            # 必须只认 target 目录下真正编内核的那棵树；find 取第一个 linux-* 会
            # 选中 toolchain-*/linux-6.12.112（只有头文件），那上面的 dry-run 全是假 INCOMPAT。
            KSRC=$(find build_dir -maxdepth 7 -type d \
              -path "*/target-*/linux-rtl9617c_generic/linux-$PROBE_KV.*" 2>/dev/null | head -1 || true)
            if [ -n "$KSRC" ]; then
              {
                echo "=== patches-$PROBE_KV 全量 dry-run 预检（内核源码 $KSRC）==="
                BAD=0
                for p in "$TREE/target/linux/rtl9617c/patches-$PROBE_KV"/*.patch; do
                  [ -f "$p" ] || continue
                  if (cd "$KSRC" && patch -p1 -R --dry-run --batch < "$p") >/dev/null 2>&1; then
                    echo "  APPLIED   $(basename "$p")"
                  elif (cd "$KSRC" && patch -p1 --dry-run --batch < "$p") >/dev/null 2>&1; then
                    echo "  OK        $(basename "$p")"
                  else
                    echo "  INCOMPAT  $(basename "$p")"
                    BAD=$((BAD + 1))
                  fi
                done
                echo "  合计 $BAD 个补丁在 $PROBE_KV 上不兼容"
              } 2>&1 | tee "$WORK/dryrun.log"
            fi

            # 探针契约：绿 = 拿到明确的迁移结论，不等于「编过了」。
            # 仅在①做 6.18→6.12 这类试验性回移、②日志里有真实的补丁应用
            # 失败证据时，把 INCOMPATIBLE 作为正式结论收下；证据全部从真实
            # 日志与全量预检结果里提取，不许脚本凭空给答案。
            # 真实编译错误、或端口原生内核系列下的失败，一律 exit 1 照实红。
            BADPATCH=$(grep -hoE 'Patch failed! +Please fix [^ ]+' \
              "$ALLLOG" "$WORK/kernel-verbose.log" 2>/dev/null | sed 's|.*/||; s/!$//' \
              | sort -u | paste -sd, - || true)
            BADN=$(grep -c '  INCOMPAT  ' "$WORK/dryrun.log" 2>/dev/null || true)
            BADLIST=$(sed -n 's/^  INCOMPAT  //p' "$WORK/dryrun.log" 2>/dev/null \
              | paste -sd, - || true)
            if [ -n "$BADPATCH" ] && [ -n "${PROBE_KV:-}" ] \
               && [ "$PROBE_KV" != "${PORT_KERNEL_PATCHVER:-}" ]; then
              echo "KERNEL_VERDICT=INCOMPATIBLE" >> "$GITHUB_ENV"
              echo "KERNEL_BADPATCH=$BADPATCH" >> "$GITHUB_ENV"
              echo "KERNEL_BADLIST=${BADLIST:-（预检未取到清单，见 dryrun.log）}" >> "$GITHUB_ENV"
              echo "VERDICT: 官方 $PROBE_REF 不能直接承载 $PORT_KERNEL_PATCHVER 端口：$BADPATCH 打不上，全量预检共 ${BADN:-0} 个补丁不兼容"
              echo "::warning::探针结论（非构建脚本故障）：$PORT_KERNEL_PATCHVER 端口内核补丁与 $PROBE_KV 基座不兼容"
            else
              echo "::error::内核/驱动编不过，错误清单见 $ALLLOG"; exit 1
            fi
          fi

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-probe-${{ inputs.openwrt_ref }}
          path: ${{ env.WORK }}/*.log
          if-no-files-found: warn

      - name: Verdict
        if: always()
        run: |
          {
            echo "## 基座探针结论"
            # 反引号在双引号里会被当命令替换执行（上一轮日志里的
            # "v25.12.6: command not found" 就是这么来的），必须转义。
            echo "- 基座：\`$PROBE_REF\`｜内核覆盖：\`${PROBE_KV:-（用端口声明）}\`"
            echo "- 端口：\`$PORT_SHA\`（声明 KERNEL_PATCHVER=$PORT_KERNEL_PATCHVER）"
            echo "- overlay/补丁：见 overlay.log 最后一行 VERDICT"
            echo "- 内核实编：${KERNEL_VERDICT:-（未启用，或已编过）}"
            echo "- 作业结论：$JOB_STATUS"
            if [ "${KERNEL_VERDICT:-}" = INCOMPATIBLE ]; then
              echo ""
              echo "> **迁移结论：官方 $PROBE_REF 不能直接承载该 $PORT_KERNEL_PATCHVER 端口。**"
              echo "> 首个打不上的补丁：\`${KERNEL_BADPATCH:-见 kernel-verbose.log}\`"
              echo "> 全量 dry-run 不兼容清单：${KERNEL_BADLIST:-见 dryrun.log}"
              echo "> 要真正切基座，必须把整份 patches-$PORT_KERNEL_PATCHVER 按 $PROBE_KV 内核源码重基线。"
              echo "> 本探针不产可刷固件；出固件仍走 build.yml（25.12.6 稳定版源 + BTF/honk 硬断言）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
